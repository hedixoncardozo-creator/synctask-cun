# Configuracion de compilacion del APK de SyncTask CUN (REQ-13).
#
# `flet build apk` lee este archivo. Tener los valores aqui en lugar de en la
# linea de comandos tiene dos ventajas: queda versionado en el repositorio, y
# cualquiera del equipo compila exactamente el mismo APK sin memorizar banderas.

[project]
name = "synctask"
version = "1.0.0"
description = "Tareas colaborativas con sincronizacion en tiempo real"
requires-python = ">=3.12"

# Estas son TODAS las dependencias del telefono. No aparece boto3 por ningun
# lado, y eso es deliberado: la cascara no habla con AWS, asi que en el APK no
# hay ni una linea de codigo de acceso a la base de datos.
#
# `flet-notifications` es la que trae el lado Dart de las notificaciones. Debe
# estar declarada aqui para que `flet build` la compile dentro del APK, y
# tambien instalada en el servidor (pip install en el venv), que es quien pide
# que se muestre el aviso. Si solo esta en uno de los dos lados, las
# notificaciones del sistema no salen.
dependencies = [
    "flet==0.86.5",
    "flet-notifications==0.1.4",
]

[tool.flet]
product = "SyncTask CUN"
company = "Corporacion Unificada Nacional de Educacion Superior"
copyright = "2026 Hedixon Cardozo, Luis Manchego - Programacion para Dispositivos Moviles"

# Identificador del paquete en Android. Es permanente: si se cambia despues de
# instalar, Android lo trata como otra aplicacion distinta y quedan las dos.
bundle_id = "co.edu.cun.synctask"

[tool.flet.splash]
# Fondo de la pantalla de presentacion, detras de assets/splash_android.png.
# Es el indigo de la marca, el mismo con el que se genero el degradado del
# icono, para que no se note el corte entre el fondo y la imagen.
color = "#4F46E5"
dark_color = "#4338CA"

[tool.flet.android]
# Android recorta el icono adaptativo con la forma que tenga configurado el
# telefono (circulo, cuadrado redondeado, gota). Por eso icon_android.png
# dibuja la marca al 60% del lienzo: asi ningun recorte se la come. Este color
# es la capa de fondo que queda visible alrededor.
adaptive_icon_background = "#4F46E5"

[tool.flet.android.permission]
# Obligatorio desde Android 13 para poder publicar en la bandeja. La propia
# aplicacion lo pide al abrirse (modulos/notificaciones.py), pero si no se
# declara aqui el sistema ni siquiera muestra el dialogo.
"android.permission.POST_NOTIFICATIONS" = true

# Para el retorno tactil al mover una tarea (ft.HapticFeedback).
"android.permission.VIBRATE" = true

# La aplicacion no sirve sin red. Flutter la agrega por su cuenta, pero se
# deja explicita para que el manifiesto se lea solo.
"android.permission.INTERNET" = true

# Servicio en primer plano. Es lo que permite que las notificaciones lleguen
# con la aplicacion fuera de pantalla o el telefono bloqueado: mantiene viva
# la conexion con el servidor, a cambio de un aviso permanente en la bandeja.
#
# El segundo permiso es obligatorio desde Android 14, y el tipo que declara
# —sincronizacion de datos— tiene que coincidir con el que pide el codigo en
# modulos/notificaciones.py.
#
# El parcheador de la extension tambien los agrega; se declaran aqui ademas
# para que el manifiesto se entienda leyendo solo este archivo. No se
# duplican: el parcheador comprueba antes de insertar.
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true


# --- Arreglo de una incompatibilidad de terceros (17 de octubre de 2026) ---
#
# El 1 de octubre se publico `jni` 1.1.0 y el ecosistema de Flutter empezo a
# migrar a el. El proyecto Flutter que genera Flet 0.86.5 todavia fija
# `jni: 1.0.0` en sus dependency_overrides, de modo que cualquier paquete ya
# migrado recibe una version mas vieja de la que esperan sus enlaces y la
# compilacion se detiene:
#
#   The generated bindings expect package:jni ^1.1.0, but 1.0.x was imported.
#
# Aparecio primero con `shared_preferences_android` 2.5.0 (publicado el 17 de
# octubre) y, al resolver ese, volvio a salir con `jni_flutter` 1.0.4+1. Son
# dependencias transitivas: ir fijandolas una por una es perseguir sintomas, y
# manana puede aparecer una tercera.
#
# Por eso se sube `jni` en lugar de bajar a quienes lo usan. La decision se
# apoya en la comprobacion que hace el propio paquete:
#
#   actualMajorVersion == major && actualMinorVersion >= minor
#
# El menor se compara con `>=`, asi que 1.1.0 satisface tanto a los enlaces
# generados contra 1.0 como a los generados contra 1.1. Subir es estrictamente
# mas seguro que quedarse, no menos.
#
# El pin de `shared_preferences_android` se conserva por prudencia: 2.4.28, del
# 28 de agosto, es la ultima que no toca JNI en absoluto, y es la que venia
# usandose sin problemas. Importa porque `shared_preferences` es donde se
# guarda el testigo de la sesion recordada (modulos/recordar.py).
#
# Ambas lineas sobran cuando Flet actualice su propio pin de `jni`. La senal de
# que ya se pueden quitar es que build/flutter/pubspec.yaml muestre
# `jni: 1.1.0` o superior sin que nosotros lo pongamos.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
shared_preferences_android = "2.4.28"
